<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TacocaT - Python Game</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <nav id="navbar">
        <div class="container nav-container">
            <div class="logo-container">
                <a href="../index.html"><span>TacocaT Inc.</span></a>
                <img src="../TacocaT.jpeg" alt="Logo" class="nav-logo">
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
            </ul>
            <button id="darkModeToggle" class="toggle-button">DARK MODE</button>
        </div>
    </nav>

    <main>
        <div class="container fade-in">
            <section class="project-detail">
                <h1>Python Game</h1>
                <img src="../IMG_1819.jpeg" alt="Python Game" class="project-hero">
                <div class="project-description">
                    <h2>About</h2>
                    <p>A simple game made using Python and the Pygame framework.</p>

                    <h2>Technologies Used</h2>
                    <ul>
                        <li>Python</li>
                        <li>Pygame</li>
                        <li>Game Development</li>
                    </ul>

                    <h2>Play the Game</h2>
                    <iframe id="gameIframe" src="../projects/pygbag.html" width="400" height="500"
                        style="border: none;">
                        Your browser does not support iframes.
                    </iframe>

                    <h2>Download</h2>
                    <p>Want to download the .apk file from pygbag? <a href="../projects/pygbag-test.apk" download>Download the APK

    <footer>
        <div class="container">
            <p>© 4/10/2025 Christopher Wang.</p>
        </div>
    </footer>

    <script src="../script.js"></script>

    <script>
        // Disable the "Leave Site?" pop-up when navigating away or closing the page
        window.addEventListener('beforeunload', function (event) {
            // Check if the game iframe is in progress or not
            var iframe = document.getElementById('gameIframe');
            if (iframe.contentWindow && iframe.contentWindow.document.body) {
                var isGameActive = iframe.contentWindow.gameActive; // This is assuming you set this variable inside the iframe when the game is active
                if (isGameActive) {
                    event.preventDefault();
                    event.returnValue = ''; // Required for most browsers
                }
            }
        });
    </script>
</body>
